<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Les certifications obtenues par Strazimiri Besim : Cisco CCNA, AWS Cloud, TryHackMe Advent of Cyber.">
    <title>Certificats | Strazimiri Besim</title>
    <link rel="icon" type="image/png" href="Certificat/logo.png">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel="stylesheet">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">Strazimiri <span>Besim</span></a>
        <nav class="navbar">
            <a href="index.html">Accueil</a>
            <a href="Projet.html">Projets</a>
            <a href="certificat.html" class="active">Certificats</a>
        </nav>
        <div class="navbar-toggle" id="openNav" onclick="openNav()"><i class='bx bx-menu'></i></div>
        <div class="navbar-close" id="closeNav" onclick="closeNav()" style="display: none;"><i class='bx bx-x'></i></div>
        <nav class="mobile-nav" id="mobileNav">
            <a href="index.html" class="logo">Strazimiri <span>Besim</span></a>
            <a href="index.html">Accueil</a>
            <a href="Projet.html">Projets</a>
            <a href="certificat.html">Certificats</a>
        </nav>
    </header>

    <section>
        <h2>Mes <span>Certifications</span></h2>

        <div class="grid-container">

            <div class="certif-card">
                <div class="img-box">
                    <img src="Certificat/Advent-25.png" alt="Advent of Cyber 2025" onclick="openLightbox(this)">
                </div>
                <div class="card-content">
                    <h3>Advent of Cyber 2025</h3>
                    <p>TryHackMe</p>
                </div>
            </div>

            <div class="certif-card">
                <div class="img-box">
                    <img src="Certificat/CCNA Presentation.png" alt="CCNA Intro" onclick="openLightbox(this)">
                </div>
                <div class="card-content">
                    <h3>Introduction aux Réseaux</h3>
                    <p>Cisco CCNA</p>
                </div>
            </div>

            <div class="certif-card">
                <div class="img-box">
                    <img src="Certificat/AWS_Presentation.png" alt="AWS Cloud" onclick="openLightbox(this)">
                </div>
                <div class="card-content">
                    <h3>AWS Cloud Foundations</h3>
                    <p>AWS Academy</p>
                </div>
            </div>

            <div class="certif-card">
                <div class="img-box">
                    <img src="Certificat/TryHackMe_AdventofCyber2024.png" alt="Advent of Cyber 2024" onclick="openLightbox(this)">
                </div>
                <div class="card-content">
                    <h3>Advent of Cyber 2024</h3>
                    <p>TryHackMe</p>
                </div>
            </div>

        </div>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Image agrandie">
    </div>

    <footer>
        © 2026 STRAZIMIRI <span>Besim</span> - Portfolio en ligne
    </footer>
    <script src="main.js"></script>
</body>
</html>
